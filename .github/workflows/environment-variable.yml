name: understand environment

on:
    workflow_dispatch: 
        inputs:        
            environment:
                description: choose environment
                required: true
                type: environment
jobs:
    job1:
        name: job1
        runs-on: ubuntu-latest
        steps:
          - name: print1
            run: echo "job1 is done"
    
    job2:
        name: job2
        runs-on: ubuntu-latest
        needs: job1
        environment: ${{inputs.environment}}
        steps:
          - name: print2
            run: echo "job 2 is done"