name: use-cashe

on:
    workflow_dispatch:
      inputs:
        using-cash:
            description: "use cashe for node"
            type: boolean
            default: true
jobs:
    build:
        name: build app
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: LEARN2/react-aapp/
        steps:
            - name: checkout
              uses: actions/checkout@v4
            
            - name: setup nodejs
              uses: actions/setup-node@v4
              with:
                node-version: "20.x"
            
            - name: install depa
              run: npm ci

            - name: test code
              run: npm run test

            - name: build app
              run: npm run build

            - name: deplay app
              run: echo "deplaying app"