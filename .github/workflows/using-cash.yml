name: use-cashe

on:
    workflow_dispatch:
      inputs:
        using-cash:
            description: "use cashe for node"
            type: boolean
            default: true
        node-version:
            description: node version
            type: choice
            options:
              - 18.x
              - 20.x
              - 21.x
            default: 20.x
jobs:
    build:
        name: build app
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: react-app/
        steps:

            - name: checkout
              uses: actions/checkout@v4
            
            - name: setup nodejs
              uses: actions/setup-node@v3
              with:
                node-version: ${{inputs.node-version}}

            - name: download cashe
              uses: actions/cache@v3
              if: ${{inputs.using-cash}}
              id: cashe
              with:
                path: react-app/node_modules
                key: ${{runner.os}}-node-${{hashFiles('react-app/package-lock.json')}}
                restore-keys: |
                    ${{runner.os}}-node-
            
            - name: install depa
              if: steps.cashe.outputs.cache-hit != 'true'
              run: npm install


            - name: test code
              run: npm run test

            - name: build app
              run: npm run build

            - name: upload artifact react
              uses: actions/upload-artifact@v3
              with:
                name: react-build
                path: react-app/build

    deploying:
        name: deploying app
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Download artifact react
              uses: actions/download-artifact@v3
              with:
                path: react-app/build

            - name: show fils
              run: ls -R
            
            - name: deplay app
              run: echo "deplaying app"