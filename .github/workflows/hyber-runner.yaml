on:
    workflow_dispatch:
    
jobs:
    job1-vm-docker:
        runs-on: ubuntu-latest
        steps:
            - name: run inside vm
              run: echo "run ${{github.job}} in vm"
            - name: run inside docker 
              uses: docker://alpine:3.14
              with:
                    entrypoint: /bin/sh
                    args: -c "echo 'run ${{github.job}} in docker'"

    job2:
        runs-on: ubuntu-latest
        needs: job1-vm-docker
        steps:
            - run: echo "run ${{github.job}}"
        
    job3:
        runs-on: ubuntu-latest
        needs: job1-vm-docker
        steps:
            - run: echo "run ${{github.job}}"
    job4:
        runs-on: ubuntu-latest
        needs: [job1-vm-docker, job3]
        steps:
            - run: echo "run ${{github.job}}"

