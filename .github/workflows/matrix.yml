name: matrix

on:
    push: 
        branches:
          - main
jobs:
    test-matrix:
        name: test matrix
        runs-on: ${{matrix.os}}
        strategy:
          fail-fast: false # continue if one job Failure
          matrix:
            node-version: [ 18.x, 20.x , 21.x]
            os:
              - ubuntu-latest
              - windows-latest
            exclude:
              - os: ubuntu:latest
                node-version: 18.x
              - os: windows-latest
                node-version: 20.x
            include:
              - os: ubuntu-latest
                node-version: 16.x
        steps:
          - name: setup node
            uses: actions/setup-node@v4
            with:
                node-version: ${{matrix['node-version']}}
          
          - name: print
            run: |
                echo "os: ${{matrix.os}} node:  ${{matrix['node-version']}}"
        
