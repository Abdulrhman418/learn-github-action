name: "17 - 3 - Custom Actions - Docker"

on:
    workflow_dispatch:
        inputs:
            url:
                description: "URL to ping"
                required: true
                default: "https://www.google.com"

jobs:
    ping-url:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Ping URL
              uses: ./.github/actions/docker-ping-url
              with:
                  url: ${{ github.event.inputs.url }}
